services:
  - type: web
    name: skillsync-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://skill-sync-five-rho.vercel.app
      - key: CLIENT_URL
        value: https://skill-sync-five-rho.vercel.app
      - key: MONGO_URI
        sync: false
